name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: test
        run: go test ./...
      - name: build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o socmon-linux-arm64 .
          sha256sum socmon-linux-arm64 > socmon-linux-arm64.sha256
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "socmon ${TAG#v}" --generate-notes
          gh release upload "$TAG" socmon-linux-arm64 socmon-linux-arm64.sha256 --clobber
